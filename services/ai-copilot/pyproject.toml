[project]
name = "fincloud-ai-copilot"
version = "0.1.0"
description = "Evidence-grounded, human-approved incident copilot for FinCloud Sentinel."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "prometheus-client>=0.23,<1",
  "pydantic>=2.11,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx2>=2,<3",
  "pytest>=8.4,<9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
