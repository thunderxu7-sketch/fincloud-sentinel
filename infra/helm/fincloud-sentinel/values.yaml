global:
  imagePullPolicy: IfNotPresent
  environment: demo
  revision: local

serviceAccount:
  create: true
  name: ""
  annotations: {}

web:
  replicaCount: 2
  image:
    repository: ghcr.io/thunderxu7-sketch/fincloud-sentinel-web
    tag: latest
  service:
    port: 80
    targetPort: 8080
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits: { cpu: 200m, memory: 128Mi }

coreApi:
  replicaCount: 3
  image:
    repository: ghcr.io/thunderxu7-sketch/fincloud-sentinel-core-api
    tag: latest
  service:
    port: 4000
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: "1", memory: 512Mi }
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 12
    targetCPUUtilizationPercentage: 65

aiCopilot:
  replicaCount: 2
  image:
    repository: ghcr.io/thunderxu7-sketch/fincloud-sentinel-ai-copilot
    tag: latest
  service:
    port: 8000
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: "1", memory: 512Mi }
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70

ingress:
  enabled: false
  className: alb
  host: sentinel.example.com
  tlsSecretName: sentinel-tls
  annotations: {}

networkPolicy:
  enabled: true

podDisruptionBudget:
  enabled: true
  minAvailable: 1
