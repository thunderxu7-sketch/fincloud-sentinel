global:
  scrape_interval: 10s
  evaluation_interval: 10s
rule_files:
  - /etc/prometheus/rules.yml
scrape_configs:
  - job_name: fincloud-core-api
    metrics_path: /metrics
    static_configs:
      - targets: ["core-api:4000"]
  - job_name: fincloud-ai-copilot
    metrics_path: /metrics
    static_configs:
      - targets: ["ai-copilot:8000"]
