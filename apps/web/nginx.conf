server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' http://localhost:4000 http://localhost:8000" always;

  location / {
    try_files $uri $uri/ $uri.html /index.html;
  }

  location ~* \.(?:js|css|svg|png|jpg|jpeg|webp|woff2)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
